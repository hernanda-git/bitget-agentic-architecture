[project]
name = "bitget-agentic-architecture"
version = "0.1.0"
description = "Safe architecture scaffold for a fully autonomous AI trading agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0,<7", "pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
